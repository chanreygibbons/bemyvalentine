<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? ❤️</title>
    <style>
        /* CSS */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff99cc, #ff6699);
            font-family: 'Brush Script MT', cursive;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: fadeIn 1.5s;
        }

        h1 {
            color: #ff3366;
            font-size: 2.5em;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 2rem;
        }

        .heart-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }

        .heart-btn:hover {
            background: #ff1a53;
            transform: scale(1.1);
        }

        .hearts {
            position: fixed;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            color: #ff3366;
            animation: float 3s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .hidden-message {
            display: none;
            margin-top: 2rem;
            font-size: 2em;
            color: #ff3366;
        }
    </style>
</head>
<body>
    <!-- HTML -->
    <div class="hearts" id="heartsContainer"></div>
    
    <div class="container">
        <h1>My Dearest Nikee ❤️</h1>
        <p>Every moment with you feels like a beautiful dream...</p>
        <p>Would you make me the happiest person and</p>
        <button class="heart-btn" onclick="showResponse()">Be My Valentine?</button>
        <div id="response" class="hidden-message"></div>
    </div>

    <script>
        // JavaScript
        function createHearts() {
            const heartsContainer = document.getElementById('heartsContainer');
            for (let i = 0; i < 50; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤';
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heartsContainer.appendChild(heart);
            }
        }

        function showResponse() {
            const response = document.getElementById('response');
            response.style.display = 'block';
            response.innerHTML = "YAY! I can't wait to celebrate with you! 💕";
            
            // Add celebration effect
            for(let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.innerHTML = '❤';
                confetti.style.position = 'fixed';
                confetti.style.color = '#ff3366';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animation = 'float 2s forwards';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 2000);
            }
        }

        // Initialize hearts when page loads
        window.onload = createHearts;
    </script>
</body>
</html>
