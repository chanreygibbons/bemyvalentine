r<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff99cc, #ff6699);
            font-family: 'Brush Script MT', cursive;
            overflow: hidden;
            flex-direction: column;
            padding: 1rem;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: fadeIn 1.5s;
            max-width: 90%;
        }

        h1 {
            color: #ff3366;
            font-size: 2em;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 1.5rem;
        }

        .heart-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }

        .heart-btn:hover {
            background: #ff1a53;
            transform: scale(1.1);
        }

        .hidden-message {
            display: none;
            margin-top: 1.5rem;
            font-size: 1.5em;
            color: #ff3366;
            animation: fadeIn 1.5s;
        }

        .gallery {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .gallery img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Dearest Nikeé ❤️</h1>
        <p>Every moment with you is magical, filled with laughter, joy, and love.</p>
        <p>Would you make me the happiest person by being my Valentine?</p>
        <button class="heart-btn" onclick="showResponse()">Be My Valentine?</button>
        <div id="response" class="hidden-message"></div>
        
        <div class="gallery">
            <img src="IMG-20231105-WA0121.jpg" alt="Us together">
            <img src="IMG-20241123-WA0051.jpg" alt="Cute memory">
            <img src="N&C-Clifton-32.jpg" alt="Our happiest moment">
        </div>
    </div>

    <script>
        function showResponse() {
            const response = document.getElementById('response');
            response.style.display = 'block';
            response.innerHTML = "YAY! Next Vra is Trou Vra! 💕";
        }
    </script>
</body>
</html>
